packages:
  - "main" # @noverna/core the published framework
  - "packages/*" # first-party adapters & optional modules
  - "internal/*" # local-only dev harness (never published)
  - "tools/*" # shared build/tsconfig tooling

# Single source of truth for third-party versions across every workspace.
# Bump here, not in individual package.json files.
catalog:
  typescript: ^7.0.2
  "@types/node": ^26.1.2
  "@citizenfx/client": 2.0.34303-1
  "@citizenfx/server": 2.0.34303-1
  tsdown: ^0.22.14
  rolldown: ^1.2.2
  magic-string: ^1.1.0
  "@biomejs/biome": ^2.5.6
  lefthook: ^2.1.10
  turbo: ^2.10.8
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10
  zod: ^4.4.3
