pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    secrets:
      run: pnpm exec node tools/scripts/check-secrets.mjs {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm turbo run typecheck --filter="...[origin/main]"
