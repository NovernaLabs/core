name: Setup
description: Checkout-agnostic toolchain setup  pnpm, Node, dependency install and Turbo cache.

inputs:
  node-version:
    description: Node.js version. Defaults to the value in .nvmrc.
    required: false
    default: ""
  install:
    description: Whether to run `pnpm install`.
    required: false
    default: "true"
  filter:
    description: Optional pnpm filter, e.g. "@noverna/core..." to install a subset.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version && '' || '.nvmrc' }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        if [ -n "${{ inputs.filter }}" ]; then
          pnpm install --frozen-lockfile --filter "${{ inputs.filter }}"
        else
          pnpm install --frozen-lockfile
        fi
      env:
        # Git hooks are pointless in CI and lefthook install can fail on a shallow clone.
        LEFTHOOK: "0"

    - name: Restore Turborepo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-
