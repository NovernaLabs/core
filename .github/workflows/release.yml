name: Release

# Publishing is a deliberate act, not a side effect of merging. Trigger this by hand
# from the Actions tab once the versions in package.json are what you want them to be.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack everything, but do not publish to npm.
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    # `id-token: write` is what makes npm provenance work, consumers can verify
    # the tarball was built by this workflow from this commit.
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # The shared setup action does not point npm at a registry, and without one
      # NODE_AUTH_TOKEN is never written into .npmrc.
      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Build publishable packages
        run: pnpm build:packages

      - name: Run tests before publishing
        run: pnpm turbo run test

      - name: Publish
        id: publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm --recursive --filter "./main" --filter "./packages/*" \
              publish --access public --no-git-checks --dry-run
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            pnpm --recursive --filter "./main" --filter "./packages/*" \
              publish --access public --no-git-checks
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Summary
        run: |
          if [ "${{ steps.publish.outputs.published }}" = "true" ]; then
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo "See https://github.com/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run only, nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi

  announce:
    name: Announce
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        if: vars.DISCORD_RELEASE_WEBHOOK_CONFIGURED == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"A new version of @noverna/core was published. https://github.com/${{ github.repository }}/releases\"}"
