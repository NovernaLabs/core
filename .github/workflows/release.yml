name: Release

# Publishing is a deliberate act, not a side effect of merging. Trigger this by hand
# from the Actions tab once the versions in package.json are what you want them to be.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack everything, but do not publish to npm.
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    # `id-token: write` is what makes npm provenance work, consumers can verify
    # the tarball was built by this workflow from this commit.
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Trusted publishing needs npm to own the upload, so point it at the registry.
      # No NODE_AUTH_TOKEN here on purpose, OIDC replaces it.
      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing wants npm 11.5.1+ on Node 22.14+, and provenance only works
      # on cloud runners. Fail loudly here rather than halfway through a publish.
      - name: Show toolchain
        run: node -v && npm -v && pnpm -v

      - name: Build publishable packages
        run: pnpm build:packages

      - name: Run tests before publishing
        run: pnpm turbo run test

      # pnpm rewrites the workspace: protocol into real version ranges while packing,
      # npm does not. npm still has to do the upload, because pnpm publish cannot speak
      # OIDC trusted publishing. So: pack with pnpm, publish the tarballs with npm.
      - name: Pack
        run: |
          rm -rf .tarballs
          mkdir -p .tarballs
          for pkg in main packages/*; do
            [ -f "$pkg/package.json" ] || continue
            ( cd "$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.tarballs" )
          done
          ls -l .tarballs

      - name: Publish
        id: publish
        run: |
          for tarball in .tarballs/*.tgz; do
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              npm publish "$tarball" --access public --dry-run
            else
              npm publish "$tarball" --access public
            fi
          done
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.publish.outputs.published }}" = "true" ]; then
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo "See https://github.com/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run only, nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi

  announce:
    name: Announce
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        if: vars.DISCORD_RELEASE_WEBHOOK_CONFIGURED == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"A new version of @noverna/core was published. https://github.com/${{ github.repository }}/releases\"}"
