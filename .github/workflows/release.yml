name: Release

# Publishing is a deliberate act, not a side effect of merging. Trigger this by hand
# from the Actions tab once the versions in package.json are what you want them to be.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack everything, but do not publish to npm.
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    # `id-token: write` is what makes npm provenance work, consumers can verify
    # the tarball was built by this workflow from this commit.
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Deliberately no setup-node with a registry-url here. That writes an .npmrc holding
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and points NPM_CONFIG_USERCONFIG
      # at it. With no token to fill in, NODE_AUTH_TOKEN keeps setup-node's literal
      # XXXXX-XXXXX-XXXXX-XXXXX placeholder, npm treats that as credentials, skips the OIDC
      # exchange entirely and gets rejected. npm already defaults to registry.npmjs.org.

      # Trusted publishing wants npm 11.5.1+ on Node 22.14+, and it only works on cloud
      # runners. Printing this makes a version mismatch obvious in the log.
      - name: Show toolchain
        run: node -v && npm -v && pnpm -v

      - name: Build publishable packages
        run: pnpm build:packages

      - name: Run tests before publishing
        run: pnpm turbo run test

      # pnpm rewrites the workspace: protocol into real version ranges while packing,
      # npm does not. npm still has to do the upload, because pnpm publish cannot speak
      # OIDC trusted publishing. So: pack with pnpm, publish the tarballs with npm.
      - name: Pack
        run: |
          rm -rf .tarballs
          mkdir -p .tarballs
          for pkg in main packages/*; do
            [ -f "$pkg/package.json" ] || continue
            ( cd "$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.tarballs" )
          done
          ls -l .tarballs

      - name: Publish
        id: publish
        run: |
          published=false
          for tarball in .tarballs/*.tgz; do
            spec=$(tar -xzOf "$tarball" package/package.json \
              | node -pe "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")

            # The packages here version independently, so a release usually only moves some
            # of them. Republishing an existing version is a hard error, which would fail
            # the whole run over a package that simply had nothing new to ship.
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on the registry, skipping."
              continue
            fi

            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Would publish $spec"
              npm publish "$tarball" --access public --dry-run
            else
              npm publish "$tarball" --access public
              published=true
            fi
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          if [ "${{ steps.publish.outputs.published }}" = "true" ]; then
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo "See https://github.com/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run only, nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi

  announce:
    name: Announce
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        if: vars.DISCORD_RELEASE_WEBHOOK_CONFIGURED == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"A new version of @noverna/core was published. https://github.com/${{ github.repository }}/releases\"}"
