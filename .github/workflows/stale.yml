name: Stale

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "status: accepted,type: security,pinned,good first issue,help wanted"
          exempt-pr-labels: "status: accepted,pinned,release"
          exempt-all-milestones: true
          stale-issue-message: |
            This issue has had no activity for 60 days. It will be closed in 14 days
            unless something happens here.

            If it is still relevant, a comment with what is still broken (and on which
            version) is enough to keep it open. Closed is not the same as rejected
            reopen it any time.
          stale-pr-message: |
            This pull request has had no activity for 30 days and will be closed in 14
            days. If you are still working on it, say so or convert it to a draft.
          close-issue-message: |
            Closing due to inactivity. Comment if this is still an issue and it will be
            reopened.
          close-pr-message: |
            Closing due to inactivity. The branch is untouched  reopen when you pick it
            back up.
